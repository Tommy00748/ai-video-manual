<title>AI 短视频全链路生产 · 新员工培训手册</title>
<style>
  :root{
    --navy:#16324F; --navy-2:#23496F; --orange:#D9551B; --orange-2:#F07A3C;
    --ink:#14171C; --ink-2:#3A424E; --ink-3:#6E7783; --ink-4:#9AA3AE;
    --line:#E2DED5; --bg:#F6F4EF; --paper:#fff;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(760px 420px at 12% -6%, rgba(217,85,27,.10), transparent 62%),
      radial-gradient(820px 520px at 92% 8%, rgba(22,50,79,.12), transparent 64%);
  }
  .gate{position:relative; z-index:1; width:100%; max-width:430px}
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:36px 34px 30px; box-shadow:0 24px 60px -18px rgba(22,50,79,.22), 0 2px 6px rgba(22,50,79,.05);
  }
  .mark{
    width:46px; height:46px; border-radius:12px; background:var(--navy);
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
  }
  .mark svg{width:24px;height:24px;color:#fff}
  h1{font-size:19px; line-height:1.45; margin:0 0 6px; letter-spacing:-.01em}
  .sub{font-size:13.5px; color:var(--ink-3); margin:0 0 24px; line-height:1.6}
  label{display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:8px}
  input[type=password]{
    width:100%; font:inherit; font-size:15px; letter-spacing:.02em;
    padding:13px 15px; border:1px solid var(--line); border-radius:11px;
    background:#FBFAF7; color:var(--ink); outline:none; transition:border-color .16s, box-shadow .16s;
  }
  input[type=password]:focus{border-color:var(--navy-2); box-shadow:0 0 0 3px rgba(35,73,111,.13)}
  button{
    width:100%; margin-top:14px; font:inherit; font-size:15px; font-weight:700;
    color:#fff; background:var(--navy); border:0; border-radius:11px; padding:13px 16px;
    cursor:pointer; transition:background .16s, transform .08s;
  }
  button:hover:not(:disabled){background:var(--navy-2)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.62; cursor:default}
  .msg{margin-top:14px; font-size:13.5px; line-height:1.55; min-height:19px}
  .msg.err{color:#B4341B}
  .msg.ok{color:#14795B}
  .hint{
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-4); line-height:1.7;
  }
  .hint b{color:var(--ink-3)}
  iframe{border:0; width:100vw; height:100vh; position:fixed; inset:0; background:#fff}
  @media (max-width:480px){ .card{padding:28px 22px 24px} }
</style>
</head>

<script>
(function () {
  var PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('form');
  var input = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var gate = document.getElementById('gate');
  var viewer = document.getElementById('viewer');

  function b64ToBuf(b64) {
    var bin = atob(b64);
    var buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  function fail(text) {
    msg.className = 'msg err';
    msg.textContent = text;
    btn.disabled = false;
    btn.textContent = '进入手册';
    input.focus();
    input.select();
  }

  async function unlock(pw) {
    btn.disabled = true;
    btn.textContent = '正在解密…';
    msg.className = 'msg';
    msg.textContent = '';

    try {
      if (!window.crypto || !window.crypto.subtle) {
        return fail('当前浏览器不支持解密所需的加密接口，请换用 Chrome、Edge 或 Safari 打开。');
      }
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(pw), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBuf(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBuf(PAYLOAD.iv) },
        key,
        b64ToBuf(PAYLOAD.ct)
      );

      var html = new TextDecoder().decode(plain);
      viewer.srcdoc = html;
      viewer.style.display = 'block';
      gate.style.display = 'none';
      document.body.style.display = 'block';
      document.body.style.padding = '0';
      document.body.style.background = '#fff';
    } catch (e) {
      fail('密码不对，请重新输入。');
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = input.value;
    if (!pw) { fail('请输入密码。'); return; }
    unlock(pw);
  });

  input.focus();
})();
</script>
